<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>r/namify launch contest — OGS Media x Radix</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0c0e; --surface:#1a1e23; --surface-2:#1e2125;
    --paper:#f4efe8; --paper-soft:#cbc7c0;
    --signal:#e8ff59; --signal-ink:#0b0c0e;
    --coral:#ff5e4d; --mute:#8a9099;
    --radius:6px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:var(--body); font-weight:400; line-height:1.62;
    font-size:17px; letter-spacing:.001em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:780px; margin:0 auto; padding:64px 24px 96px}
  ::selection{background:var(--signal); color:var(--signal-ink)}

  /* Wordmark */
  .wordmark{font-size:22px; line-height:1; display:inline-flex; align-items:baseline; gap:.34em}
  .wordmark .ogs{font-family:var(--serif); font-style:italic; font-weight:500; letter-spacing:-.01em}
  .wordmark .media{font-family:var(--mono); font-weight:700; letter-spacing:.16em; font-size:.72em; transform:translateY(-1px)}
  .tagline{font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--mute); margin-top:10px}

  /* Lock screen */
  #lock{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .lockcard{width:100%; max-width:420px; text-align:left}
  .lockcard .wordmark{font-size:26px}
  .lock-note{font-family:var(--mono); font-size:12px; letter-spacing:.03em; color:var(--mute); text-transform:uppercase; margin:40px 0 12px}
  .lock-title{font-family:var(--serif); font-weight:500; font-size:26px; line-height:1.2; margin:0 0 24px; letter-spacing:-.01em}
  .lock-row{display:flex; gap:10px}
  #pw{
    flex:1; background:var(--surface); border:1px solid rgba(244,239,232,.14); color:var(--paper);
    font-family:var(--body); font-size:16px; padding:13px 14px; border-radius:var(--radius); outline:none;
  }
  #pw:focus{border-color:var(--signal); box-shadow:0 0 0 2px rgba(232,255,89,.35)}
  #go{
    background:var(--signal); color:var(--signal-ink); border:0; cursor:pointer;
    font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.04em;
    padding:0 20px; border-radius:var(--radius);
  }
  #go:hover{filter:brightness(1.04)}
  #err{color:var(--coral); font-family:var(--mono); font-size:13px; margin-top:14px; min-height:18px; visibility:hidden}
  #err.show{visibility:visible}
  .lock-foot{font-size:13px; color:var(--mute); margin-top:28px; line-height:1.5}

  /* Document */
  #content{display:none}
  .masthead{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; padding-bottom:26px; border-bottom:1px solid rgba(244,239,232,.12)}
  .masthead .tagline{margin-top:0}

  .dochead{padding:52px 0 8px}
  .kicker{font-family:var(--mono); font-size:12.5px; letter-spacing:.03em; color:var(--mute); text-transform:uppercase; margin:0 0 22px; display:flex; align-items:center; gap:10px}
  .tick{width:10px; height:10px; background:var(--signal); border-radius:2px; display:inline-block; flex:none}
  .title{font-family:var(--serif); font-weight:500; font-size:clamp(38px,7vw,60px); line-height:1.02; letter-spacing:-.02em; margin:0}
  .subtitle{font-family:var(--serif); font-style:italic; font-weight:400; color:var(--paper-soft); font-size:clamp(19px,3vw,23px); margin:14px 0 0}

  .block{padding:54px 0; border-top:1px solid rgba(244,239,232,.10)}
  .block:first-of-type{border-top:0}
  .secnum{
    display:inline-block; font-family:var(--mono); font-weight:700; font-size:13px;
    background:var(--signal); color:var(--signal-ink); padding:3px 9px; border-radius:4px; letter-spacing:.02em; margin-bottom:16px;
  }
  h2{font-family:var(--serif); font-weight:500; font-size:clamp(25px,4vw,31px); line-height:1.14; letter-spacing:-.015em; margin:0 0 16px}
  h3{font-family:var(--serif); font-weight:500; font-size:21px; line-height:1.2; margin:0; letter-spacing:-.01em}
  h4{font-family:var(--body); font-weight:700; font-size:14px; letter-spacing:.01em; margin:0 0 12px}
  p{margin:0 0 15px}
  p.lead{color:var(--paper-soft); font-size:18px; margin-bottom:26px}
  strong{font-weight:700; color:var(--paper)}

  ul.clean{list-style:none; margin:0 0 4px; padding:0}
  ul.clean li{position:relative; padding-left:20px; margin-bottom:14px}
  ul.clean li::before{content:""; position:absolute; left:0; top:.66em; width:8px; height:2px; background:var(--coral); border-radius:2px}
  ul.clean.tight li{margin-bottom:9px}

  /* Concept cards */
  .concept{background:var(--surface); border:1px solid rgba(244,239,232,.09); border-radius:var(--radius); padding:28px 28px 16px; margin:26px 0}
  .concept-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px}
  .role{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); border:1px solid rgba(138,144,153,.4); padding:3px 8px; border-radius:100px; white-space:nowrap}
  dl{margin:20px 0 14px}
  dt{font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--coral); margin-top:26px}
  dt:first-child{margin-top:0}
  dd{margin:7px 0 0; color:var(--paper)}
  .tld{font-family:var(--mono); font-size:.82em; color:var(--paper); border:1px solid rgba(244,239,232,.22); border-radius:4px; padding:1px 6px; white-space:nowrap; margin-right:2px}

  /* Prize menu */
  .parts{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin:8px 0 12px}
  .part{background:var(--surface); border:1px solid rgba(244,239,232,.09); border-radius:var(--radius); padding:20px}
  .part h4{color:var(--paper)}
  .part ul.clean li{font-size:15px}

  .bundles-head{margin:34px 0 14px; font-family:var(--serif)}
  .bundles{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px}
  .bundle{background:var(--surface); border:1px solid rgba(244,239,232,.09); border-radius:var(--radius); padding:20px; position:relative}
  .bundle.reco{border-color:var(--signal); box-shadow:0 0 0 1px var(--signal)}
  .bundle-tag{position:absolute; top:-11px; left:20px; background:var(--signal); color:var(--signal-ink); font-family:var(--mono); font-weight:700; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:4px}
  .bundle-name{font-family:var(--serif); font-weight:600; font-size:19px; margin-bottom:14px}
  .bundle.reco .bundle-name{color:var(--paper)}
  .bundle ul.clean li{font-size:14.5px}
  .reco-line{margin-top:24px; font-size:19px}
  .mark{background:var(--signal); color:var(--signal-ink); font-weight:500; padding:2px 8px; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone}

  /* Run list */
  dl.run dt{color:var(--coral)}
  dl.run dd{margin-bottom:14px}

  /* Callout */
  .block.callout{background:var(--surface-2); border-radius:var(--radius); padding:34px 30px; border-top:0; margin-top:20px}
  .secnum.cta{background:var(--signal)}
  ul.checks{list-style:none; margin:8px 0 0; padding:0}
  ul.checks li{position:relative; padding-left:28px; margin-bottom:13px}
  ul.checks li::before{content:""; position:absolute; left:0; top:.28em; width:13px; height:13px; border:2px solid var(--signal); border-radius:3px}

  /* Footer */
  .foot{margin-top:48px; padding-top:24px; border-top:1px solid rgba(244,239,232,.12); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px}
  .foot-mark{font-size:16px; display:inline-flex; align-items:baseline; gap:.34em}
  .foot-mark .ogs{font-family:var(--serif); font-style:italic; font-weight:500}
  .foot-mark .media{font-family:var(--mono); font-weight:700; letter-spacing:.16em; font-size:.72em}
  .foot-note{font-family:var(--mono); font-size:11.5px; color:var(--mute); letter-spacing:.02em}

  @media (max-width:680px){
    .wrap{padding:40px 20px 72px}
    .parts,.bundles{grid-template-columns:1fr}
    .bundle.reco{margin-top:8px}
    .concept{padding:20px 18px 6px}
    .block.callout{padding:26px 20px}
  }
</style>
</head>
<body>
  <div id="lock">
    <div class="lockcard">
      <div class="wordmark"><span class="ogs">OGS</span><span class="media">MEDIA</span></div>
      <p class="lock-note">Protected document</p>
      <h1 class="lock-title">Enter the password to read the brief.</h1>
      <div class="lock-row">
        <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
        <button id="go">Unlock</button>
      </div>
      <div id="err">That password did not work. Try again.</div>
      <p class="lock-foot">Prepared by OGS Media for Radix. If you need the password, contact Ursula.</p>
    </div>
  </div>

  <main id="content" class="wrap"></main>

  function b2b(b64){return Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});}
  async function unlock(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b2b(SALT),iterations:ITER,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2b(IV)},key,b2b(CT));
    return new TextDecoder().decode(pt);
  }
  var pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err"),lock=document.getElementById("lock"),content=document.getElementById("content");
  async function attempt(){
    err.classList.remove("show");
    try{
      var html=await unlock(pw.value);
      content.innerHTML=html;
      lock.style.display="none";
      content.style.display="block";
      window.scrollTo(0,0);
    }catch(e){
      err.classList.add("show"); pw.value=""; pw.focus();
    }
  }
  go.addEventListener("click",attempt);
  pw.addEventListener("keydown",function(e){if(e.key==="Enter")attempt();});
